name: binovya

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-binovya.com}
      SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:?NUXT_PUBLIC_SUPABASE_URL is required}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nuxt:
        condition: service_healthy

  nuxt:
    image: ghcr.io/mehdidiasgomes/binovya:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: missing
    restart: unless-stopped
    logging: *logging
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
