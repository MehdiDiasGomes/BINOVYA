version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*mehdidiasgomes/binovya'
